stages:
  exploracion:
    cmd: python src/exploracion.py
    deps:
    - data/raw/datos_clientes.csv
    - data/raw/datos_resenas.csv
    - pyproject.toml
    - src/exploracion.py
    outs:
    - docs/figures
  calidad:
    cmd: python src/calidad.py
    deps:
    - data/raw/datos_clientes.csv
    - data/raw/datos_resenas.csv
    - pyproject.toml
    - src/calidad.py
    - src/esquemas.py
    - tests/test_calidad.py
    - uv.lock
    outs:
    - docs/reports/calidad
  preparacion:
    cmd: python src/preparacion.py
    deps:
    - data/raw/datos_clientes.csv
    - data/raw/datos_resenas.csv
    - pyproject.toml
    - src/esquemas.py
    - src/imputacion.py
    - src/integracion.py
    - src/preparacion.py
    - uv.lock
    outs:
    - data/processed/preparacion
    - docs/reports/preparacion
  entrenamiento:
    cmd: python -m src.entrenamiento
    deps:
    - data/processed/preparacion/datos_sin_imputar.csv
    - pyproject.toml
    - src/entrenamiento.py
    - src/experimentacion.py
    - uv.lock
    outs:
    - docs/reports/entrenamiento:
        cache: false
    - models/modelo.joblib:
        cache: false
  pruebas_modelo:
    cmd: python -m pytest -q tests/test_modelo.py
    deps:
    - data/processed/preparacion/datos_sin_imputar.csv
    - docs/reports/entrenamiento/metricas_modelo.json
    - models/modelo.joblib
    - src/entrenamiento.py
    - src/experimentacion.py
    - tests/test_modelo.py
  monitoreo:
    cmd: python -m src.monitoreo_ap2
    deps:
    - data/processed/preparacion/datos_sin_imputar.csv
    - data/raw/resenas_nuevas.csv
    - data/raw/resenas_nuevas_drift.csv
    - docs/reports/entrenamiento/metricas_modelo.json
    - models/modelo.joblib
    - pyproject.toml
    - src/entrenamiento.py
    - src/experimentacion.py
    - src/monitoreo_ap2.py
    - src/monitoreo_drift.py
    - uv.lock
    outs:
    - docs/reports/monitoreo:
        cache: false
